<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Black Squircle Background -->
  <rect width="1024" height="1024" rx="230" fill="#000000" />

  <defs>
    <!-- Top-Right Mask (y < x) -->
    <clipPath id="clip-tr">
      <polygon points="0,0 1024,0 1024,1024" />
    </clipPath>
    <!-- Bottom-Left Mask (y > x) -->
    <clipPath id="clip-bl">
      <polygon points="0,0 0,1024 1024,1024" />
    </clipPath>

    <!-- Option Key Path -->
    <g id="option-key" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 280 340 L 440 340" />
      <path d="M 280 684 L 400 684 L 624 340 L 744 340" />
    </g>
  </defs>

  <!-- Bottom-Left Piece (Shifted down and left to show the slice) -->
  <g clip-path="url(#clip-bl)" transform="translate(-24, 24)">
    <use href="#option-key" />
  </g>

  <!-- Top-Right Piece (Shifted up and right to show the slice) -->
  <g clip-path="url(#clip-tr)" transform="translate(24, -24)">
    <use href="#option-key" />
  </g>

  <!-- Delicate Dashed "Cut" Line traversing the gap -->
  <path d="M 180 180 L 844 844" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="12 24" stroke-linecap="round" />

  <!-- A tiny, elegant minimal open scissors placed centrally -->
  <g transform="translate(512, 512) rotate(45) scale(0.9)">
    <!-- Halo to cut out the dashed line underneath the scissors -->
    <g stroke="#000000" stroke-width="16" stroke-linecap="round">
      <path d="M -22 -16 L 40 16" />
      <path d="M -22 16 L 40 -16" />
    </g>
    <circle cx="-32" cy="-16" r="14" fill="#000000" />
    <circle cx="-32" cy="16" r="14" fill="#000000" />

    <!-- Scissors Shapes -->
    <circle cx="-32" cy="-16" r="10" stroke="#FFFFFF" stroke-width="6" fill="#000000" />
    <circle cx="-32" cy="16" r="10" stroke="#FFFFFF" stroke-width="6" fill="#000000" />
    <path d="M -22 -16 L 40 16" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <path d="M -22 16 L 40 -16" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="-2" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
